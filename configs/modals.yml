category-data:
  title:
    en: "Data for this category"
    it: "Dati per questa categoria"
    es: "Datos para esta categoría"
  inputs:
    - id: "description"
      required: false
      type: 2
      label:
        en: "Description"
        it: "Descrizione"
        es: "Descripción"
      placeholder:
        en: "Description of the category. MAX 100 charcters."
        it: "Descrizione della categoria. MAX 100 caratteri."
        es: "Descripción de la categoría. MAX 100 caracteres."
    - id: "normal_category"
      required: true
      type: "channel_menu"
      channel_types: [4]
      label:
        en: "Default ticket category"
        it: "Categoria predefinita dei ticket"
        es: "Categoría predeterminada de los tickets"
      placeholder:
        en: "Where normal tickets will be created"
        it: "Dove saranno creati i ticket normali"
        es: "Dónde se crearán los tickets normales"
    - id: "vip_category"
      required: true
      type: "channel_menu"
      channel_types: [4]
      label:
        en: "Category for VIP tickets"
        it: "Categoria per i ticket VIP"
        es: "Categoría para los tickets VIP"
      placeholder:
        en: "Where VIP tickets will be created"
        it: "Dove saranno creati i ticket VIP"
        es: "Dónde se crearán los tickets VIP"
    - id: "emoji"
      required: false
      type: 2
      label:
        en: "Category emoji"
        it: "Emoji della categoria"
        es: "Emoji de la categoría"
      placeholder:
        en: "Must be an emoji (to be sure you can copy paste from a chat message)."
        it: "Deve essere un'emoji (per essere sicuro puoi copiare incollare da un messaggio di chat)."
        es: "Debe ser un emoji (para estar seguro puedes copiar pegar desde un mensaje de chat)."
    - id: "helper_role"
      required: false
      type: "role_menu"
      label:
        en: "Helper role"
        it: "Ruolo dell'assistente"
        es: "Rol de ayudante"
      placeholder:
        en: "Select the helper role"
        it: "Seleziona il ruolo dell'assistente"
        es: "Selecciona el rol de ayudante"

ticket-reopening-reason:
  title:
    en: "Reason for reopening the ticket"
    it: "Motivo per riaprire il ticket"
    es: "Motivo para reabrir el ticket"
  inputs:
    - id: "reopen_reason"
      required: true
      type: 2
      label:
        en: "Reason"
        it: "Motivo"
        es: "Motivo"
      placeholder:
        en: "Explain the reason for reopening the ticket."
        it: "Spiega il motivo per cui stai riaprendo il ticket."
        es: "Explica el motivo por el que estás reabriendo el ticket."