# Short input = 1
# Paragraph input = 2

# Channel Types:
# DM = 1
# GuildVoice = 2
# GroupDM = 3
# GuildCategory = 4

customize-panel:
  title:
    en: "Customize ticket panel"
    it: "Personalizza pannello dei ticket"
    es: "Personalizar panel de tickets"
  inputs:
    - id: "panel_title"
      required: false
      type: 1
      label:
        en: "Panel title"
        it: "Titolo del pannello"
        es: "Título del panel"
      placeholder:
        en: "Leave blank to not change it."
        it: "Lascia vuoto per non cambiarlo."
        es: "Deja en blanco para no cambiarlo."
      value:
        en: "<!--panel_title--!>"
        it: "<!--panel_title--!>"
        es: "<!--panel_title--!>"
    - id: "panel_description"
      required: false
      type: 2
      label:
        en: "Panel description (markdown supported)"
        it: "Descrizione del pannello (markdown supportato)"
        es: "Descripción del panel (markdown compatible)"
      placeholder:
        en: "Leave blank to not change it. Discord markdown compatible."
        it: "Lascia vuoto per non cambiarlo. Compatibile con il markdown di Discord."
        es: "Deja en blanco para no cambiarlo. Compatible con el markdown de Discord."
      value:
        en: "<!--panel_description--!>"
        it: "<!--panel_description--!>"
        es: "<!--panel_description--!>"
    - id: "panel_color"
      required: false
      type: 1
      label:
        en: "Panel color"
        it: "Colore del pannello"
        es: "Color del panel"
      placeholder:
        en: "The color panel in HEX code (e.g. #03bafc). Leave blank to not change it."
        it: "Il colore del pannello in codice HEX (es. #03bafc). Lascia vuoto per non cambiarlo."
        es: "El color del panel en código HEX (ej. #03bafc). Deja en blanco para no cambiarlo."
      value:
        en: "<!--panel_color--!>"
        it: "<!--panel_color--!>"
        es: "<!--panel_color--!>"

