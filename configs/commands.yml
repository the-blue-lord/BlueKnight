# __________________________________________________
#
# COMMANDS CONFIGURATION, SEE BELOW FOR FURTHER INFORMATION
# 
# <command name>:
#   description: <the description of the command> (string)
#   test: <whether the command should be shown or not> (false/true)
#   options: <the options needed for this command> (array of command_option)
#
#   <command_option>:
#     id: <the id of the option>
#     name: <the name of the option wich will be displayed bold on the left> (string)
#     description <the description of the option wich will be displayed on the right> (right)
#     required: <whether it's mandatory to input the option before sending> (true/false)
#     type: <what type of data can be inputted in this option> (application_command_option_type)
#
#     <application_command_option_type>:
#       Subcommand: 1
#       SubcommandGroup: 2
#       String: 3
#       Integer: 4
#       Boolean: 5
#       User: 6
#       Channel: 7
#       Role: 8
#       Mentionable: 9
#       Number: 10
#       Attachment: 11
# 
# __________________________________________________


# VARIABLES

language-choices: &language_choices
  - name: "English"
    value: "en"
  - name: "Italiano"
    value: "it"
  - name: "Español"
    value: "es"


# MESSAGES 

msg-already-setup:
  description: "Send already-setup message"
  test: true
  options:
    - name: "language"
      description: "The message language"
      required: false
      type: 3
      choices: *language_choices

