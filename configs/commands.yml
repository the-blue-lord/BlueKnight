# MISC

ping:
  description: "Get bot ping"
  test: false

server-info:
  description: "Display information on the server"
  test: true

setup-info:
  description: "Display information on how to setup the bot"
  test: true



# SETTINGS

set-add_ticket_category:
  description: "Add a ticket category to the server"
  test: true
  options:
    - name: "name"
      description: "The name of the category to be added (it must be unique)"
      required: true
      type: 3
    - name: "description"
      description: "The description of the category to be added"
      required: true
      type: 3
    - name: "normal-category"
      description: "The channel category where you want a normal ticket of this ticket category to be placed"
      required: true
      type: 7
    - name: "vip-category"
      description: "The channel category where you want a vip ticket of this ticket category to be placed"
      required: true
      type: 7
    - name: "emoji"
      description: "The emoji for this category (USE ONLY SIMPLE EMOJIS)"
      required: true
      type: 3
    - name: "category-helper"
      description: "The role (apart from helper and BotAdmin role) that can manage tickets in this category"
      required: false
      type: 8

set-admin_role:
  description: "Setup the BotAdmin role in the bot database"
  test: true
  options:
    - name: "role"
      description: "The role that can run every bot command, even the most delicate ones (settings commands)"
      required: false
      type: 8

set-default_ticket_emoji:
  description: "Set the default emoji for the tickets"
  test: true
  options:
    - name: "emoji"
      description: "The emoji to be used as the default ticket emoji"
      required: true
      type: 3

set-language:
  description: "Set the language for this server"
  test: true
  options:
    - name: "language"
      description: "The language you want the bot to use"
      required: true
      type: 3
      choices: *language_choices

set-helper_role:
  description: "Setup the helper role in the bot database"
  test: true
  options:
    - name: "role"
      description: "The role that can interact with every command of the bot, except the most delicate ones (settings commands)"
      required: false
      type: 8

set-remove_ticket_category:
  description: "Remove a ticket category from the server"
  test: true
  options:
    - name: "name"
      description: "The name of the category to be removed"
      required: true
      type: 3

set-ticket_category:
  description: "Set the ticket category for the server"
  test: true
  options:
    - name: "category"
      description: "The channel category to be set"
      required: true
      type: 7
    - name: "vip"
      description: "Whether this is the VIP category"
      required: true
      type: 5

set-ticket_panel:
  description: "Customize the ticket panel"
  test: true

set-vip_role:
  description: "Setup the vip role in the bot database"
  test: true
  options:
    - name: "role"
      description: "The role that will be used as the VIP role"
      required: false
      type: 8

set-vip_ticket_emoji:
  description: "Set the emoji that will be displayed next to the category emoji in vip tickets name"
  test: true
  options:
    - name: "emoji"
      description: "The emoji to be used as the vip ticket emoji"
      required: true
      type: 3


setup:
  description: "Add server to the bot database"
  test: true



# TICKETING

tck-panel:
  description: "Display the ticket panel"
  test: true

tck-open:
  test: false
  description: "Open a new ticket for a user."
  options:
    - name: "user"
      description: "The user whom to open the ticket to"
      required: true
      type: 9