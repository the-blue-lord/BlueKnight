    es: "La categoría ha sido configurada con éxito en la base de datos del bot. Puedes comprobar que todo haya ido como se esperaba ejecutando el comando `/server-info`."

category-added:
  type: "success"
  title:
    en: "Category added"
    it: "Categoria aggiunta"
    es: "Categoría añadida"
  content:
    en: "The category has been successfully added to the bot's database. You can check everything went as expected by running the `/server-info` command."
    it: "La categoria è stata aggiunta con successo al database del bot. Puoi controllare che tutto sia andato come previsto eseguendo il comando `/server-info`."
    es: "La categoría ha sido añadida con éxito a la base de datos del bot. Puedes comprobar que todo haya ido como se esperaba ejecutando el comando `/server-info`."

category-removed:
  type: "success"
  title:
    en: "Category removed"
    it: "Categoria rimossa"
    es: "Categoría eliminada"
  content:
    en: "The category has been successfully removed from the bot's database. You can check everything went as expected by running the `/server-info` command."
    it: "La categoria è stata rimossa con successo dal database del bot. Puoi controllare che tutto sia andato come previsto eseguendo il comando `/server-info`."
    es: "La categoría ha sido eliminada con éxito de la base de datos del bot. Puedes comprobar que todo haya ido como se esperaba ejecutando el comando `/server-info`."

panel-updated:
  type: "success"
  title:
    en: "Ticket panel updated"
    it: "Pannello dei ticket aggiornato"
    es: "Panel de tickets actualizado"
  content:
    en: "The ticket panel has been successfully updated. You can check everything went as expected by running the `/tck-panel` command."
    it: "Il pannello dei ticket è stato aggiornato con successo. Puoi controllare che tutto sia andato come previsto eseguendo il comando `/tck-panel`."
    es: "El panel de tickets ha sido actualizado con éxito. Puedes comprobar que todo haya ido como se esperaba ejecutando el comando `/tck-panel`."

category-used:
  type: "error"
  title:
    en: "Ticket category name already in use"
    it: "Nome della categoria dei ticket già in uso"
    es: "Nombre de la categoría de tickets ya en uso"
  content:
    en: "The name you just tried to use for the ticket category is already in use by another category. Please choose a different name.\n\nIf you belive this is an error, you can\n* see the list of categories by running the `/server-info` command and then going to the tickets page\n* run the `/set-remove_ticket_category` command with the ticket category name you just use to delete that category from the bot's database and then re-run `/set-add_ticket_category`."
    it: "Il nome che hai appena provato ad usare per la categoria dei ticket è già in uso da un'altra categoria. Per favore, scegli un nome diverso.\n\nSe credi ci sia un errore, puoi\n* vedere la lista delle categorie eseguendo il comando `/server-info` e poi andando alla pagina dei ticket\n* eseguire il comando `/set-remove_ticket_category` con il nome della categoria dei ticket che hai appena usato per eliminare quella categoria dal database del bot e poi rieseguire `/set-add_ticket_category`."
    es: "El nombre que acabas de intentar usar para la categoría de tickets ya está en uso por otra categoría. Por favor, elige un nombre diferente.\n\nSi crees que hay un error, puedes\n* ver la lista de categorías ejecutando el comando `/server-info` y luego yendo a la página de tickets\n* ejecutar el comando `/set-remove_ticket_category` con el nombre de la categoría de tickets que acabas de usar para eliminar esa categoría de la base de datos del bot y luego volver a ejecutar `/set-add_ticket_category`."

language-setup:
  type: "success"
  title:
    en: "Language changed"
    it: "Lingua cambiata"
    es: "Idioma cambiado"
  content:
    en: "The bot's server language was successfully changed"
    it: "[IT] The bot's server language was successfully changed"
    es: "[ES] The bot's server language was successfully changed"