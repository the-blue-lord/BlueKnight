    it: "Il ruolo BotAdmin è stato impostato con successo nel database del bot. Puoi controllare che tutto sia andato come previsto eseguendo il comando `/server-info`."
    es: "El rol BotAdmin ha sido configurado con éxito en la base de datos del bot. Puedes comprobar que todo haya ido como se esperaba ejecutando el comando `/server-info`."

